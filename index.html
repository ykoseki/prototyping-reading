<title>保護されたページ</title>
<style>
:root{--bg:#fbfaf7;--fg:#1f2328;--muted:#5d6670;--accent:#0b6e6e;--rule:#e3e0d8;--card:#fff;--err:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--fg:#e6e6e3;--muted:#a3a9b0;--accent:#5cc8c0;--rule:#30343a;--card:#202327;--err:#ff8a7a}}
:root[data-theme="dark"]{--bg:#17191c;--fg:#e6e6e3;--muted:#a3a9b0;--accent:#5cc8c0;--rule:#30343a;--card:#202327;--err:#ff8a7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:28px 24px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--fg)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:14px 0 18px}
button{width:100%;font:inherit;font-size:16px;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.5em;margin:12px 0 0;color:var(--err)}
</style>

</form>

(function(){
  var SALT='3agTpImtD9vyw/9Yep+1XA==', IV='WS/8eOmHGxvpfqyW', ITER=600000, STORE='enc-key-v1';
  function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
